name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Route engine tests
        run: node tests/test_engine.js

      - name: Fetch the footpath network (preview build for pull requests, main build otherwise)
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then order="data/network-v2-preview data/network-v2"; else order="data/network-v2 data/network-v2-preview"; fi
          for b in $order; do
            if git fetch -q --depth=1 origin "$b" 2>/dev/null; then
              git show FETCH_HEAD:data/net-v2.json > /tmp/net-v2.json || continue
              git show FETCH_HEAD:data/net-v3.bin.gz > /tmp/net-v3.bin.gz 2>/dev/null || rm -f /tmp/net-v3.bin.gz   # builds before v0.3 have no binary
              echo "::notice::footpath network from $b ($(ls /tmp/net-v*.json /tmp/net-v*.gz 2>/dev/null | xargs du -h | tr '\n' ' '))"; break
            fi
          done

      - name: Footpath network tests (real routes, both profiles)
        run: |
          if [ -f /tmp/net-v3.bin.gz ]; then node tests/test_network_v2.js /tmp/net-v3.bin.gz /tmp/net-v2.json; fi
          node tests/test_network_v2.js /tmp/net-v2.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Start a static server
        run: |
          python -m http.server 8766 > /dev/null 2>&1 &
          sleep 1

      - name: Browser tests (planner workflow, offline fallback, stubbed online services) on net.json
        run: python tests/smoke.py

      - name: Browser tests on the footpath network
        run: |
          if [ ! -f /tmp/net-v2.json ]; then echo "::warning::no footpath network build to test"; exit 0; fi
          NET_FILE=/tmp/net-v2.json python tests/smoke.py
          if [ -f /tmp/net-v3.bin.gz ]; then
            NET_FILE=/tmp/net-v3.bin.gz python tests/smoke.py                 # route engine in the Web Worker
            NET_FILE=/tmp/net-v3.bin.gz ENGINE=inline python tests/smoke.py   # fallback: engine in the page
          fi

      - name: Browser tests (3D view; WebGL through SwiftShader, OpenFreeMap replaced by a test tile)
        run: python tests/view3d.py

      - name: Browser tests (moving the map while drawing, desktop + touch)
        run: python tests/pan_while_drawing.py

      - name: Browser tests (Start - turn-by-turn, off-route, OpenStreetMap layer; taking a finish off)
        run: |
          python tests/navigate.py
          if [ -f /tmp/net-v3.bin.gz ]; then
            NET_FILE=/tmp/net-v3.bin.gz python tests/navigate.py                 # cues from the footpath network
            NET_FILE=/tmp/net-v3.bin.gz ENGINE=inline python tests/navigate.py   # engine in the page
          fi

  # Safari's engine. Its system libraries are packaged for Ubuntu 24.04, so this job runs there.
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + WebKit
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps webkit

      - name: Start a static server
        run: |
          python -m http.server 8766 > /dev/null 2>&1 &
          sleep 1

      - name: Browser tests in WebKit (Start, live location, location button, removable finish)
        run: BROWSER=webkit python tests/navigate.py
